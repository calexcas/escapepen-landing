<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pausa Consciente</title>
<style>
  body { background: #070B13; margin: 0; }
</style>
<script>
  (function() {
    // Verifica se o usuário já viu uma versão (mantém consistência)
    var saved = localStorage.getItem('lp_version');

    if (saved) {
      window.location.replace(saved);
      return;
    }

    // Novo visitante: sorteia 50/50
    var version = Math.random() < 0.5 ? '/premium.html' : '/dark.html';

    // Salva para manter consistência em visitas futuras
    localStorage.setItem('lp_version', version);

    // Registra no dataLayer do GTM/GA4 se disponível
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: 'ab_test_assignment',
      lp_version: version === '/premium.html' ? 'A_premium' : 'B_dark'
    });

    window.location.replace(version);
  })();
</script>
</head>
<body></body>
</html>
